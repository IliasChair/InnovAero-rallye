<style>
/* Schriften liegen im Repository, damit keine Anfragen an Dritte gehen. */
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 600; font-display: swap; src: url(fonts/barlow-condensed-600.woff2) format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-style: normal; font-weight: 700; font-display: swap; src: url(fonts/barlow-condensed-700.woff2) format("woff2"); }
@font-face { font-family: "Public Sans"; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/public-sans.woff2) format("woff2"); }
:root {
  --ink: #0e2433;
  --muted: #4d606c;
  --paper: #eef2f4;
  --card: #ffffff;
  --line: #c9d4da;
  --bar: #0e2433;
  --bar-ink: #f4f8fa;
  --signal: #f4b400;
  --signal-ink: #201700;
  --brick: #a63d2a;
  --ok: #1d7a4a;
  --focus: #0b5fff;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #e9f0f4;
    --muted: #9fb2be;
    --paper: #0a161e;
    --card: #122430;
    --line: #2a4352;
    --bar: #06111a;
    --brick: #e0775f;
    --ok: #4cc58a;
    --focus: #7db0ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #e9f0f4;
  --muted: #9fb2be;
  --paper: #0a161e;
  --card: #122430;
  --line: #2a4352;
  --bar: #06111a;
  --brick: #e0775f;
  --ok: #4cc58a;
  --focus: #7db0ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); }
body { font: 400 18px/1.5 var(--body); -webkit-text-size-adjust: 100%; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-ink); }
.bar-in { max-width: 560px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
.brand { flex: 1; min-width: 0; line-height: 1.1; }
.brand b { display: block; font: 700 22px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 459px) { body:not(.locked) .bar .clock { display: none; } }
@media (max-width: 359px) { .brand b { font-size: 18px; } .bar-in { gap: 6px; } button.chip { padding: 8px; } }
.brand span { display: block; font-size: 13px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { font: 600 15px/1 var(--body); padding: 8px 10px; border: 1.5px solid rgba(255,255,255,.35); border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip b { font-weight: 700; }
button.chip { min-height: 44px; background: transparent; color: var(--bar-ink); cursor: pointer; }
.info-btn { min-width: 44px; min-height: 44px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.35); background: transparent; color: var(--bar-ink); font: 700 18px/1 var(--body); cursor: pointer; }

.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }
.route { list-style: none; margin: 14px 0 6px; padding: 0; display: flex; }
.route li { flex: 1; position: relative; text-align: center; }
.route li::before { content: ""; position: absolute; top: 16px; left: -50%; width: 100%; height: 4px; background: var(--line); }
.route li:first-child::before { display: none; }
.route li.done::before, .route li.now::before { background: var(--ink); }
.route li span { position: relative; z-index: 1; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); background: var(--paper); font: 700 17px/1 var(--display); color: var(--muted); }
.route li.done span { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.route li.now span { background: var(--signal); border-color: var(--ink); color: var(--signal-ink); }

main { padding-bottom: 48px; }
.eyebrow { margin: 18px 0 0; font: 600 15px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 4px 0 12px; font: 700 40px/1.02 var(--display); letter-spacing: .01em; text-wrap: balance; }
h2 { margin: 0 0 6px; font: 700 24px/1.1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
h3 { margin: 18px 0 8px; font: 700 20px/1.1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
p { margin: 0 0 12px; }
.lead { font-size: 19px; }
.muted { color: var(--muted); }

.clue { background: var(--card); border: 2px solid var(--ink); border-left-width: 10px; border-left-color: var(--signal); border-radius: 12px; padding: 16px; margin: 6px 0 14px; }
.clue .label { font: 600 14px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.clue .txt { font-size: 21px; line-height: 1.45; margin: 0; }

.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; margin: 0 0 14px; }
.card .tag { display: inline-block; font: 600 13px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.card.log { border: 2px solid var(--ink); }
.card.done { border-color: var(--ok); border-width: 2px; }
.note { border-left: 4px solid var(--line); padding: 2px 0 2px 12px; color: var(--muted); }
.warn { background: var(--card); border: 2px solid var(--brick); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; }

.btn { display: block; width: 100%; min-height: 58px; padding: 12px 16px; border-radius: 12px; border: 2.5px solid var(--ink); background: transparent; color: var(--ink); font: 700 22px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; text-align: center; margin: 0 0 10px; }
.btn.primary { background: var(--signal); border-color: var(--ink); color: var(--signal-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 48px; font-size: 18px; }
.btn.opt { font: 600 20px/1.25 var(--body); letter-spacing: 0; text-transform: none; text-align: left; background: var(--card); }
.btn.opt:disabled { text-decoration: line-through; }

label.field { display: block; font-weight: 600; margin: 4px 0 6px; }
input[type="text"], input[type="password"] { width: 100%; min-height: 54px; padding: 10px 14px; font: 400 20px/1.3 var(--body); color: var(--ink); background: var(--card); border: 2.5px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
input[type="text"]:focus, input[type="password"]:focus { border-color: var(--focus); outline: none; }
body.locked .bar button { display: none; }
.check { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 4px; font-weight: 600; cursor: pointer; }
.check input { width: 30px; height: 30px; flex: none; accent-color: var(--ink); }
.msg { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); }
.msg.ok { border-color: var(--ok); }
.msg.bad { border-color: var(--brick); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
ul.plain { margin: 0 0 12px; padding-left: 20px; }
ul.plain li { margin-bottom: 8px; }
ol.logl { list-style: none; margin: 8px 0 14px; padding: 0; font-variant-numeric: tabular-nums; }
ol.logl li { padding: 6px 0; border-bottom: 1px solid var(--line); }
ol.logl li b { display: inline-block; min-width: 3.4em; }

#sheet { position: fixed; inset: 0; z-index: 10; background: var(--paper); overflow-y: auto; }
#sheet[hidden] { display: none; }
.sheet-in { max-width: 560px; margin: 0 auto; padding: 16px 16px 60px; }
.sheet-in h2 { margin-top: 22px; }
a { color: var(--focus); }
@media (prefers-reduced-motion: no-preference) { .btn { transition: transform .08s; } .btn:active { transform: translateY(1px); } }
</style>

<script>
(function () {
  "use strict";

  /* Die Seite enthält keine Rallye-Inhalte im Klartext. Stationen, Rätsel, Fragen, Wildcards und
     Einstellungen liegen verschlüsselt im Block "vault" und werden erst mit dem Team-Passwort lesbar.
     Der Spielstand wird nur verschlüsselt im Browser gespeichert. */
  var VERSION = 4;
  var VAULT = {};
  try { VAULT = JSON.parse(document.getElementById("vault").textContent); } catch (e) {}
  var TEAMS = VAULT.teams || {};

  var C = null;            /* entschlüsselter Inhalt */
  var stations = [], N = 0;
  var state = fresh();
  var sess = null;         /* { team, key } nach dem Entsperren */
  var ui = { confirmHelp: false, confirmReset: false, sheet: "info", booting: true, gateTeam: null, gateMsg: "", busy: false };

  /* ---------- Hilfsfunktionen ---------- */
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function nowHM() { var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function top() { window.scrollTo(0, 0); }
  function cfg(k) { return (C && C.config && C.config[k]) || ""; }
  function teamLabel() { return sess ? TEAMS[sess.team].label : ""; }
  function wildCount() { return Object.keys(state.wild).filter(function (k) { return state.wild[k]; }).length; }
  function orga() {
    var p = cfg("orgaPhone");
    if (p) return "Wenn ihr gar nicht weiterkommt: <a href=\"tel:" + esc(p.replace(/\s+/g, "")) + "\"><b>" + esc(p) + "</b></a>";
    return "Die Nummer der Orga bekommt ihr beim Briefing.";
  }
  function photoNote() { return esc(cfg("photoNote") || "Wohin ihr die Fotos schickt, sagt die Orga beim Briefing."); }

  /* ---------- Verschlüsselung ---------- */
  function b64(buf) { var s = "", u = new Uint8Array(buf); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function derive(team, pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(TEAMS[team].salt), iterations: VAULT.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    });
  }
  function decryptRaw(key, iv, ct) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(iv) }, key, unb64(ct)); }
  function decryptText(key, iv, ct) { return decryptRaw(key, iv, ct).then(function (b) { return new TextDecoder().decode(b); }); }
  function encryptText(key, text) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(text)).then(function (ct) { return { iv: b64(iv), ct: b64(ct) }; });
  }
  /* Team-Schlüssel entpackt den Inhaltsschlüssel, der den Inhalt entschlüsselt. Schlägt fehl, wenn das Passwort falsch ist. */
  function openVault(team, key) {
    var T = TEAMS[team];
    return decryptRaw(key, T.iv, T.wrapped).then(function (raw) {
      return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    }).then(function (cek) {
      return decryptText(cek, VAULT.content.iv, VAULT.content.ct);
    }).then(function (t) { return JSON.parse(t); });
  }

  /* ---------- Spielstand ---------- */
  function storeKey(team) { return "innovaero-rallye-v" + VERSION + "-" + team; }
  function fresh() {
    return { v: VERSION, team: "", i: 0, phase: "here", solved: {}, wrong: {}, helped: {}, photo: {}, bonus: false, bonusWrong: [], wild: {}, times: {}, finish: "" };
  }
  function valid(d) { return d && d.v === VERSION && typeof d.i === "number" && d.i >= 0 && d.i < stations.length; }
  function loadState() {
    var raw = null, box;
    try { raw = localStorage.getItem(storeKey(sess.team)); } catch (e) {}
    if (!raw) return Promise.resolve(null);
    try { box = JSON.parse(raw); } catch (e) { return Promise.resolve(null); }
    return decryptText(sess.key, box.iv, box.ct).then(function (t) { var d = JSON.parse(t); return valid(d) ? d : null; }).catch(function () { return null; });
  }
  var saving = Promise.resolve();
  function save() {
    if (!sess) return;
    var s = sess, text = JSON.stringify(state);
    saving = saving.then(function () { return encryptText(s.key, text); }).then(function (box) {
      try { localStorage.setItem(storeKey(s.team), JSON.stringify(box)); } catch (e) {}
    }).catch(function () {});
  }

  /* Der Team-Schlüssel wird als nicht exportierbares Objekt in IndexedDB gemerkt,
     damit das Passwort auf einem Handy nur einmal eingegeben werden muss. */
  function idb(mode, fn) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("innovaero-rallye", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("k"); };
      r.onerror = function () { rej(r.error); };
      r.onsuccess = function () {
        var db = r.result, tx = db.transaction("k", mode), q = fn(tx.objectStore("k"));
        tx.oncomplete = function () { db.close(); res(q.result); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error); };
      };
    });
  }
  function remember(team, key) { return idb("readwrite", function (s) { return s.put({ team: team, key: key }, "session"); }).catch(function () {}); }
  function recall() { return idb("readonly", function (s) { return s.get("session"); }).catch(function () { return null; }); }
  function forget() { return idb("readwrite", function (s) { return s.delete("session"); }).catch(function () {}); }

  function setContent(c) {
    C = c;
    stations = c.stations || [];
    stations.forEach(function (s, i) { s.idx = i; s.num = (s.kind === "stop") ? i : 0; });
    N = stations.length - 2;
  }
  function openSession(team, key, store) {
    return openVault(team, key).then(function (c) {
      setContent(c);
      sess = { team: team, key: key };
      return loadState();
    }).then(function (d) {
      state = d || fresh();
      ui.busy = false; ui.booting = false; ui.gateTeam = null; ui.gateMsg = "";
      if (store) remember(team, key);
      render(); top();
    });
  }
  function unlock(team, pw) {
    if (!pw || !pw.trim()) { ui.gateMsg = "Bitte das Passwort eingeben."; render(); return; }
    ui.busy = true; ui.gateMsg = ""; render();
    derive(team, pw).then(function (key) { return openSession(team, key, true); }).catch(function () {
      ui.busy = false; ui.gateMsg = "Das Passwort passt nicht. Probiert es noch einmal."; render();
      var p = $("#pw"); if (p) p.focus();
    });
  }
  function lock() {
    sess = null; C = null; stations = []; state = fresh(); ui.confirmReset = false; ui.gateTeam = null; ui.gateMsg = "";
    forget(); $("#sheet").hidden = true; render(); top();
  }

  /* ---------- Darstellung ---------- */
  function renderRoute() {
    var h = "";
    for (var k = 0; k < stations.length; k++) {
      var label = k === 0 ? "S" : (k === stations.length - 1 ? "Z" : String(k));
      var cls = (state.phase === "finished" || k < state.i) ? "done" : (k === state.i ? "now" : "");
      h += "<li class=\"" + cls + "\"><span>" + label + "</span></li>";
    }
    $("#route").innerHTML = h;
  }
  function renderHeader() {
    document.body.classList.toggle("locked", !sess);
    $("#wn").textContent = String(wildCount());
    $("#teamline").textContent = !sess ? "City Rallye" : (state.team ? teamLabel() + ": " + state.team : teamLabel());
    $("#clock").textContent = nowHM();
  }

  function renderGate() {
    $("#route").innerHTML = "";
    var h;
    if (ui.booting) {
      h = "<p class=\"eyebrow\">Start</p><h1>Einen Moment</h1><p class=\"muted\">Die Rallye wird geladen.</p>";
    } else if (!Object.keys(TEAMS).length) {
      h = "<p class=\"eyebrow\">Start</p><h1>Noch nicht bereit</h1><p class=\"lead\">Die Rallye ist noch nicht eingerichtet.</p>";
    } else if (!ui.gateTeam) {
      h = "<p class=\"eyebrow\">Start</p><h1>Welches Team seid ihr?</h1>";
      h += "<p class=\"lead\">Wählt euer Team. Danach gebt ihr einmal das Passwort ein, das ihr beim Briefing bekommt.</p>";
      Object.keys(TEAMS).forEach(function (k) {
        h += "<button class=\"btn primary\" data-act=\"gate-team\" data-team=\"" + esc(k) + "\">" + esc(TEAMS[k].label) + "</button>";
      });
    } else {
      h = "<p class=\"eyebrow\">" + esc(TEAMS[ui.gateTeam].label) + "</p><h1>Passwort</h1>";
      h += "<form id=\"gate\" novalidate><label class=\"field\" for=\"pw\">Passwort vom Briefing</label>";
      h += "<input type=\"password\" id=\"pw\" autocomplete=\"current-password\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"" + (ui.busy ? " disabled" : "") + ">";
      if (ui.gateMsg) h += "<p class=\"msg bad\">" + esc(ui.gateMsg) + "</p>";
      h += "<button class=\"btn primary\" type=\"submit\"" + (ui.busy ? " disabled" : "") + ">" + (ui.busy ? "Wird geprüft" : "Entsperren") + "</button></form>";
      h += "<button class=\"btn small\" data-act=\"gate-back\"" + (ui.busy ? " disabled" : "") + ">Anderes Team wählen</button>";
      h += "<p class=\"muted\">Auf diesem Handy müsst ihr das Passwort nur einmal eingeben. Groß- und Kleinschreibung ist egal.</p>";
    }
    $("#stage").innerHTML = h;
  }

  function renderTravel(st) {
    var label = st.kind === "finish" ? "Unterwegs zum Ziel" : "Unterwegs zu Station " + st.num;
    var h = "<p class=\"eyebrow\">" + (st.kind === "finish" ? "Letzte Etappe" : "Station " + st.num + " von " + N) + "</p>";
    h += "<h1>" + label + "</h1>";
    h += "<div class=\"clue\"><div class=\"label\">Hinweis</div><p class=\"txt\">" + esc(st.riddle) + "</p></div>";
    if (st.eta) h += "<p class=\"muted\">Richtwert: " + esc(st.eta) + ". Löst das Rätsel schon beim Gehen.</p>";
    h += "<button class=\"btn primary\" data-act=\"arrive\">Wir sind da</button>";
    if (state.helped[st.id]) {
      h += "<div class=\"msg\">Euer Ziel: <b>" + esc(st.name) + "</b></div>";
    } else if (ui.confirmHelp) {
      h += "<div class=\"msg\">Das Ziel jetzt verraten?</div><div class=\"row\"><button class=\"btn small\" data-act=\"help-yes\">Ja, verraten</button><button class=\"btn small\" data-act=\"help-no\">Abbrechen</button></div>";
    } else {
      h += "<button class=\"btn small\" data-act=\"help-ask\">Ziel verraten</button>";
    }
    h += "<button class=\"btn small\" data-act=\"wild-open\">Wildcards ansehen</button>";
    h += "<p class=\"muted\">" + orga() + "</p>";
    $("#stage").innerHTML = h;
  }

  function ready(st) {
    if (st.motif && !state.photo[st.id]) return false;
    if (st.q && !state.solved[st.id]) return false;
    return true;
  }

  function choiceBlock(q, solved, wrongList, act) {
    var h = "";
    if (solved) return "<p class=\"msg ok\">Richtig: " + esc(q.answer) + "</p>";
    q.opts.forEach(function (o, k) {
      var off = wrongList.indexOf(k) >= 0;
      h += "<button class=\"btn opt\" data-act=\"" + act + "\" data-k=\"" + k + "\"" + (off ? " disabled" : "") + ">" + esc(o) + "</button>";
    });
    if (wrongList.length) h += "<p class=\"msg bad\">Nicht ganz. Probiert eine andere Antwort.</p>";
    return h;
  }

  function renderHere(st) {
    var first = st.kind === "start";
    var nextIsFinish = stations[st.idx + 1] && stations[st.idx + 1].kind === "finish";
    var h = "<p class=\"eyebrow\">" + (first ? "Start" : "Station " + st.num + " von " + N) + "</p><h1>" + esc(st.name) + "</h1>";
    if (st.intro) h += "<p class=\"lead\">" + esc(st.intro) + "</p>";
    if (first) h += "<label class=\"field\" for=\"team\">Teamname (freiwillig)</label><input type=\"text\" id=\"team\" maxlength=\"40\" autocomplete=\"off\" value=\"" + esc(state.team) + "\" placeholder=\"Muss nicht sein\">";
    if (st.note) h += "<p class=\"note\">" + esc(st.note) + "</p>";

    if (st.motif) {
      h += "<div class=\"card\"><span class=\"tag\">" + (first ? "Beweisfoto" : "Motivaufgabe") + "</span><p>" + esc(st.motif) + "</p>";
      h += "<label class=\"check\"><input type=\"checkbox\" id=\"photo\"" + (state.photo[st.id] ? " checked" : "") + "><span>Foto ist gemacht</span></label>";
      h += "<p class=\"muted\" style=\"margin:0\">" + photoNote() + "</p></div>";
    }

    if (st.q) {
      h += "<div class=\"card\"><span class=\"tag\">Wissensfrage</span><p>" + esc(st.q.text) + "</p>";
      h += choiceBlock(st.q, state.solved[st.id] === true, state.wrong[st.id] || [], "pick");
      h += "</div>";
    }

    if (st.bonus) {
      h += "<div class=\"card\"><span class=\"tag\">Bonusfrage</span><p>" + esc(st.bonus.text) + "</p>";
      h += choiceBlock(st.bonus, state.bonus, state.bonusWrong, "pick-bonus");
      h += "</div>";
    }

    if (st.wildHint) {
      h += "<div class=\"card\"><span class=\"tag\">Wildcard, freiwillig</span><p>Hier sind viele Leute unterwegs. Eine gute Gelegenheit für eine Wildcard, wenn euer Team Lust hat.</p><button class=\"btn small\" data-act=\"wild-open\" style=\"margin:0\">Wildcards ansehen</button></div>";
    }
    if (first) {
      h += "<div class=\"card\"><span class=\"tag\">Wildcards, freiwillig</span><p>Unterwegs könnt ihr kleine Zusatzaufgaben machen, zum Beispiel einen Passanten ansprechen. Euer Team entscheidet, ob und welche. Sie landen in eurem Logbuch.</p><button class=\"btn small\" data-act=\"wild-open\" style=\"margin:0\">Wildcards ansehen</button></div>";
    }

    if (st.skip) {
      h += "<div class=\"warn\"><b>" + esc(st.skip.title || "Zeitregel") + ":</b> " + esc(st.skip.text) + "</div>";
    }

    var label = first ? "Rallye starten, erstes Rätsel zeigen" : (nextIsFinish ? "Rätsel für das Ziel zeigen" : "Rätsel für die nächste Station zeigen");
    h += "<button class=\"btn primary\" id=\"next\" data-act=\"next\"" + (ready(st) ? "" : " disabled") + ">" + label + "</button>";
    if (st.skip) {
      h += "<button class=\"btn small\" data-act=\"skip\"" + (ready(st) ? "" : " disabled") + ">" + esc(st.skip.button || "Direkt zum Ziel") + "</button>";
    }
    h += "<p class=\"muted\">" + orga() + "</p>";
    $("#stage").innerHTML = h;
  }

  function logbook() {
    var h = "<div class=\"card log\"><span class=\"tag\">Logbuch</span><h2>" + esc(state.team || teamLabel()) + "</h2>";
    if (state.team) h += "<p class=\"muted\" style=\"margin:0\">" + esc(teamLabel()) + "</p>";
    if (C.dateLine) h += "<p class=\"muted\">" + esc(C.dateLine) + "</p>";
    h += "<ol class=\"logl\">";
    stations.forEach(function (s) {
      var t = state.times[s.id];
      if (t) h += "<li><b>" + esc(t) + "</b> " + esc(s.name) + (s.kind === "start" ? " (Start)" : "") + "</li>";
    });
    h += "</ol>";
    var done = (C.wild || []).filter(function (w) { return state.wild[w.id]; });
    if (done.length) {
      h += "<p style=\"margin:0\"><b>Wildcards</b></p><ul class=\"plain\" style=\"margin:4px 0 0\">";
      done.forEach(function (w) { h += "<li>" + esc(w.short) + "</li>"; });
      h += "</ul>";
    } else {
      h += "<p class=\"muted\" style=\"margin:0\">Keine Wildcards diesmal. Das ist völlig in Ordnung.</p>";
    }
    h += "</div>";
    return h;
  }

  function after() {
    var a = C.after;
    if (!a) return "";
    var h = "<h2>" + esc(a.h || "Danach") + "</h2>";
    if (a.p) h += "<p>" + esc(a.p) + "</p>";
    if (a.items && a.items.length) {
      h += "<ul class=\"plain\">";
      a.items.forEach(function (it) { h += "<li>" + (it.b ? "<b>" + esc(it.b) + ":</b> " : "") + esc(it.t) + "</li>"; });
      h += "</ul>";
    }
    if (cfg("meetup")) h += "<p><b>" + esc(cfg("meetup")) + "</b></p>";
    return h;
  }

  function renderFinish() {
    var n = wildCount();
    var ziel = stations[stations.length - 1];
    var h = "<p class=\"eyebrow\">Ziel erreicht</p><h1>Geschafft" + (state.team ? ", " + esc(state.team) : "") + "</h1>";
    h += "<p class=\"lead\">Ankunft um <b>" + esc(state.finish) + "</b>." + (ziel.arrival ? " " + esc(ziel.arrival) : "") + "</p>";
    if (cfg("reward")) h += "<div class=\"card\"><span class=\"tag\">Für euch</span><p style=\"margin:0\">" + esc(cfg("reward")) + "</p></div>";
    if (cfg("wildReward") && n > 0) h += "<div class=\"card\"><span class=\"tag\">Für eure Wildcards</span><p style=\"margin:0\">Ihr habt " + (n === 1 ? "eine Wildcard" : n + " Wildcards") + " geschafft. " + esc(cfg("wildReward")) + "</p></div>";
    h += logbook();
    h += "<p class=\"muted\">Macht einen Screenshot vom Logbuch als Erinnerung. " + photoNote() + "</p>";
    h += after();
    h += "<p class=\"muted\">" + orga() + "</p>";
    $("#stage").innerHTML = h;
  }

  function render() {
    renderHeader();
    if (!sess) { renderGate(); return; }
    renderRoute();
    var st = stations[state.i];
    if (state.phase === "finished") renderFinish();
    else if (st.kind !== "start" && state.phase === "travel") renderTravel(st);
    else renderHere(st);
  }

  function infoSheet() {
    var h = "<button class=\"btn primary\" data-act=\"sheet-close\">Zurück zur Rallye</button>";
    (C.info || []).forEach(function (sec) {
      h += "<h2>" + esc(sec.h) + "</h2>";
      if (sec.p) h += "<p>" + esc(sec.p) + "</p>";
      if (sec.list) { h += "<ul class=\"plain\">"; sec.list.forEach(function (li) { h += "<li>" + esc(li) + "</li>"; }); h += "</ul>"; }
    });
    h += "<button class=\"btn small\" data-act=\"wild-open\">Wildcards ansehen</button>";
    h += "<h2>Hilfe</h2><p>" + orga() + "</p>";
    h += "<h2>Fotos</h2><p>" + photoNote() + "</p>";
    h += "<h2>Handy weitergeben</h2><p>Sperrt die Seite, bevor ihr das Handy aus der Hand gebt. Euer Stand bleibt verschlüsselt gespeichert und ist nach dem Passwort wieder da.</p>";
    h += "<button class=\"btn small\" data-act=\"lock\">Sperren</button>";
    h += "<h2>Neu beginnen</h2>";
    if (ui.confirmReset) h += "<p class=\"msg bad\">Alle Eingaben dieses Teams gehen verloren.</p><div class=\"row\"><button class=\"btn small\" data-act=\"reset-yes\">Ja, zurücksetzen</button><button class=\"btn small\" data-act=\"reset-no\">Abbrechen</button></div>";
    else h += "<button class=\"btn small\" data-act=\"reset-ask\">Eingaben zurücksetzen</button>";
    return h;
  }

  function wildSheet() {
    var h = "<button class=\"btn primary\" data-act=\"sheet-close\">Zurück zur Rallye</button>";
    h += "<h2>Wildcards</h2><p>Freiwillige Zusatzaufgaben. Euer Team entscheidet, ob und welche es macht, und ihr könnt sie unterwegs jederzeit erledigen. Tippt danach auf den Knopf. Wer lieber nicht möchte, lässt es aus.</p>";
    h += "<p class=\"note\">Bitte kein Foto und kein Video von Fremden ohne ihr Einverständnis. Ein Nein gilt sofort. Kein Körperkontakt, kein Alkohol, kein Geld.</p>";
    var wild = C.wild || [], levels = [];
    wild.forEach(function (w) { if (levels.indexOf(w.lvl) < 0) levels.push(w.lvl); });
    levels.forEach(function (lvl) {
      h += "<h3>" + esc(lvl) + "</h3>";
      wild.filter(function (w) { return w.lvl === lvl; }).forEach(function (w) {
        var on = !!state.wild[w.id];
        h += "<div class=\"card" + (on ? " done" : "") + "\"><p>" + esc(w.t) + "</p>";
        h += "<button class=\"btn small\" data-act=\"wild-toggle\" data-id=\"" + esc(w.id) + "\" style=\"margin:0\">" + (on ? "Erledigt, antippen zum Rückgängigmachen" : "Das haben wir gemacht") + "</button></div>";
      });
    });
    return h;
  }

  function renderSheet() { $("#sheet-body").innerHTML = ui.sheet === "wild" ? wildSheet() : infoSheet(); }
  function openSheet(kind) { ui.sheet = kind; renderSheet(); $("#sheet").hidden = false; $("#sheet").scrollTop = 0; }

  /* ---------- Aktionen ---------- */
  function go(act, el) {
    if (act === "gate-team") { ui.gateTeam = el.getAttribute("data-team"); ui.gateMsg = ""; render(); var p = $("#pw"); if (p) p.focus(); return; }
    if (act === "gate-back") { ui.gateTeam = null; ui.gateMsg = ""; render(); return; }
    if (!sess) return;
    var st = stations[state.i];
    if (act === "lock") { lock();
    } else if (act === "arrive") {
      state.times[st.id] = nowHM();
      if (st.kind === "finish") { state.phase = "finished"; state.finish = nowHM(); }
      else state.phase = "here";
      ui.confirmHelp = false;
      save(); render(); top();
    } else if (act === "help-ask") { ui.confirmHelp = true; render();
    } else if (act === "help-no") { ui.confirmHelp = false; render();
    } else if (act === "help-yes") { state.helped[st.id] = true; ui.confirmHelp = false; save(); render();
    } else if (act === "pick") {
      var k = parseInt(el.getAttribute("data-k"), 10);
      if (k === st.q.correct) { state.solved[st.id] = true; }
      else { var w = state.wrong[st.id] || []; if (w.indexOf(k) < 0) w.push(k); state.wrong[st.id] = w; }
      save(); render();
    } else if (act === "pick-bonus") {
      var kb = parseInt(el.getAttribute("data-k"), 10);
      if (kb === st.bonus.correct) { state.bonus = true; }
      else if (state.bonusWrong.indexOf(kb) < 0) { state.bonusWrong.push(kb); }
      save(); render();
    } else if (act === "next") {
      if (!ready(st)) return;
      if (st.kind === "start") state.times[st.id] = nowHM();
      state.i += 1; state.phase = "travel"; ui.confirmHelp = false;
      save(); render(); top();
    } else if (act === "skip") {
      if (!st.skip || !ready(st)) return;
      state.i = stations.length - 1; state.phase = "travel"; ui.confirmHelp = false;
      save(); render(); top();
    } else if (act === "sheet-open") { openSheet("info");
    } else if (act === "wild-open") { openSheet("wild");
    } else if (act === "sheet-close") { $("#sheet").hidden = true; ui.confirmReset = false;
    } else if (act === "wild-toggle") {
      var id = el.getAttribute("data-id");
      if (state.wild[id]) delete state.wild[id]; else state.wild[id] = true;
      save(); renderHeader(); renderSheet();
    } else if (act === "reset-ask") { ui.confirmReset = true; renderSheet();
    } else if (act === "reset-no") { ui.confirmReset = false; renderSheet();
    } else if (act === "reset-yes") { state = fresh(); ui.confirmReset = false; save(); $("#sheet").hidden = true; render(); top(); }
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (b && !b.disabled) go(b.getAttribute("data-act"), b);
  });
  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "gate") { e.preventDefault(); if (!ui.busy && ui.gateTeam) unlock(ui.gateTeam, $("#pw").value); }
  });
  document.addEventListener("change", function (e) {
    if (sess && e.target && e.target.id === "photo") {
      state.photo[stations[state.i].id] = e.target.checked; save(); render();
    }
  });
  document.addEventListener("input", function (e) {
    if (sess && e.target && e.target.id === "team") { state.team = e.target.value; save(); renderHeader(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("#sheet").hidden) go("sheet-close");
  });

  /* ---------- Start ---------- */
  function boot() {
    if (!(window.crypto && crypto.subtle && window.TextEncoder)) {
      renderHeader();
      $("#stage").innerHTML = "<p class=\"eyebrow\">Start</p><h1>Browser zu alt</h1><p class=\"lead\">Dieser Browser kann die Rallye nicht entsperren. Öffnet die Seite bitte in einem aktuellen Safari oder Chrome.</p>";
      return;
    }
    render();
    recall().then(function (r) {
      if (!r || !r.key || !TEAMS[r.team]) throw new Error("none");
      return openSession(r.team, r.key, false);
    }).catch(function () {
      forget(); sess = null; C = null; stations = []; state = fresh(); ui.booting = false; render();
    });
  }
  boot();
  setInterval(function () { var c = $("#clock"); if (c) c.textContent = nowHM(); }, 15000);
})();
</script>
</body>
</html>
