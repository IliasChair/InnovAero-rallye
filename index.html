<style>

:root {

* { box-sizing: border-box; }

.bar { position: sticky; top: 0; z-index: 5; background: var(--bar); color: var(--bar-ink); }

.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

.route li { flex: 1; position: relative; text-align: center; }
.route li::before { content: ""; position: absolute; top: 16px; left: -50%; width: 100%; height: 4px; background: var(--line); }

main { padding-bottom: 48px; }

p { margin: 0 0 12px; }
.lead { font-size: 19px; }

.clue { background: var(--card); border: 2px solid var(--ink); border-left-width: 10px; border-left-color: var(--signal); border-radius: 12px; padding: 16px; margin: 6px 0 14px; }
.clue .label { font: 600 14px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.clue .txt { font-size: 21px; line-height: 1.45; margin: 0; }

.card { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 16px; margin: 0 0 14px; }
.card .tag { display: inline-block; font: 600 13px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.card.log { border: 2px solid var(--ink); }
.card.done { border-color: var(--ok); border-width: 2px; }
.note { border-left: 4px solid var(--line); padding: 2px 0 2px 12px; color: var(--muted); }
.warn { background: var(--card); border: 2px solid var(--brick); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; }

.group b { display: block; font: 700 24px/1.1 var(--display); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 4px; }
.group p { margin: 0; }

/* Schrittliste einer Station: erledigt (Haken, eine Zeile), aktuell (aufgeklappt), kommend (grau) */
.steps { list-style: none; margin: 6px 0 0; padding: 0; }
.step { position: relative; margin-left: 13px; padding: 0 0 18px 24px; border-left: 3px solid var(--line); }
.step:last-child { border-left-color: transparent; padding-bottom: 0; }
.step.done { border-left-color: var(--ok); }
.step.done:last-child { border-left-color: transparent; }
.score b { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
@media (prefers-reduced-motion: no-preference) {
  .wig1 { animation: wig .35s ease-in-out; --a: 3deg; }
  .wig2 { animation: wig .4s ease-in-out; --a: 6deg; }
  .wig3 { animation: wig .45s ease-in-out 2; --a: 9deg; }
  .wig4 { animation: wig .5s ease-in-out 2; --a: 12deg; }
  .pop { animation: pop .9s ease-out forwards; }
  .pop.shake { animation: shake .12s linear 4, pop .9s ease-out .48s forwards; }
}
@keyframes wig { 25% { transform: rotate(calc(var(--a) * -1)) scale(1.04); } 75% { transform: rotate(var(--a)) scale(1.04); } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.4); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); } 70% { opacity: 1; transform: translate(-50%, -70%) scale(1); } to { opacity: 0; transform: translate(-50%, -95%) scale(1); } }
@keyframes shake { 0%, 100% { transform: translate(-50%, -50%) rotate(0); } 25% { transform: translate(-50%, -50%) rotate(-14deg); } 75% { transform: translate(-50%, -50%) rotate(14deg); } }
@media (prefers-reduced-motion: no-preference) { .nope { animation: nope .4s ease-in-out; } }
@keyframes nope { 20% { transform: translateX(-5px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.route .dot[data-act] { cursor: default; -webkit-tap-highlight-color: transparent; }
.toast { position: fixed; left: 50%; top: 42%; z-index: 40; transform: translate(-50%, -50%) rotate(-4deg); padding: 16px 22px; border: 3px solid #fff; border-radius: 12px; background: var(--brick); color: #fff; font: 700 38px/1 var(--display); letter-spacing: .04em; text-align: center; max-width: 86vw; width: max-content; box-shadow: 0 10px 30px rgba(0,0,0,.35); pointer-events: none; transition: opacity .3s; }
.toast.long { font-size: 28px; line-height: 1.1; }
@media (prefers-reduced-motion: no-preference) {
  .toast.t1 { animation: t1 .3s ease-out both; }
  .toast.t2 { animation: t2 .7s ease-out both; }
  .toast.t3 { animation: t3 1s ease-out both; }
  .quake { animation: quake .6s linear .12s; }
}
@keyframes t1 { from { opacity: 0; transform: translate(-50%, -46%); } to { opacity: 1; transform: translate(-50%, -50%); } }
/* Stufe 1: ruhiger Hinweis statt Warnschild */
.toast.t1 { transform: translate(-50%, -50%); padding: 14px 18px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font: 600 18px/1.3 var(--body); letter-spacing: 0; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
@keyframes t2 { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-4deg) scale(.4); } 25% { opacity: 1; transform: translate(-50%, -50%) rotate(-9deg) scale(1.15); } 40% { transform: translate(calc(-50% + 8px), -50%) rotate(5deg) scale(1.05); } 55% { transform: translate(calc(-50% - 8px), -50%) rotate(-8deg) scale(1.05); } 70% { transform: translate(calc(-50% + 5px), -50%) rotate(2deg) scale(1); } 85% { transform: translate(calc(-50% - 3px), -50%) rotate(-6deg); } 100% { transform: translate(-50%, -50%) rotate(-4deg) scale(1); } }
@keyframes t3 { 0% { opacity: 0; transform: translate(-50%, -50%) rotate(-14deg) scale(2.6); } 18% { opacity: 1; transform: translate(-50%, -50%) rotate(-4deg) scale(.92); } 28% { transform: translate(calc(-50% + 16px), calc(-50% - 6px)) rotate(8deg) scale(1.08); } 38% { transform: translate(calc(-50% - 16px), calc(-50% + 6px)) rotate(-12deg) scale(1.06); } 48% { transform: translate(calc(-50% + 13px), -50%) rotate(7deg) scale(1.04); } 58% { transform: translate(calc(-50% - 11px), -50%) rotate(-10deg) scale(1.02); } 70% { transform: translate(calc(-50% + 7px), -50%) rotate(3deg); } 82% { transform: translate(calc(-50% - 4px), -50%) rotate(-6deg); } 100% { transform: translate(-50%, -50%) rotate(-4deg) scale(1); } }
@media (prefers-reduced-motion: no-preference) { .jig { animation: jig .4s ease-out; } }
@keyframes jig { 0% { transform: rotate(var(--d)) translateY(var(--y)); } 20% { transform: rotate(calc(var(--d) + 3deg)) translateY(var(--y)); } 40% { transform: rotate(calc(var(--d) - 2.5deg)) translateY(var(--y)); } 60% { transform: rotate(calc(var(--d) + 1.5deg)) translateY(var(--y)); } 80% { transform: rotate(calc(var(--d) - 1deg)) translateY(var(--y)); } 100% { transform: rotate(var(--d)) translateY(var(--y)); } }
@keyframes quake { 10%, 50%, 90% { transform: translate(-7px, 3px); } 30%, 70% { transform: translate(7px, -3px); } }
.pop { position: fixed; z-index: 30; pointer-events: none; line-height: 1; transform: translate(-50%, -50%); transition: opacity .9s; }
.brand b, .score b { display: inline-block; }
.brand { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#egg { position: fixed; inset: 0; z-index: 20; background: var(--paper); overflow-y: auto; }
#egg[hidden] { display: none; }
.flyby { font-size: 56px; line-height: 1; margin-top: 18px; }
@media (prefers-reduced-motion: no-preference) { .flyby { animation: flyby 1.4s cubic-bezier(.2,.8,.2,1) both; } }
@keyframes flyby { from { transform: translate(-120vw, 40px) rotate(-12deg); } to { transform: none; } }
.memeimg { container-type: inline-size; position: relative; margin: 14px 0; border: 2.5px solid var(--ink); border-radius: 12px; overflow: hidden; background: #000; }
.memeimg img { display: block; width: 100%; height: auto; }
.memeimg b { position: absolute; left: 8px; right: 8px; text-align: center; color: #fff; font: 700 30px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; text-shadow: 0 0 3px #000, 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
.memeimg .top { top: 8px; }
.memeimg .ov { left: 50%; right: auto; transform: translate(-50%, -50%); white-space: nowrap; font-size: 26px; font-size: 7.5cqw; }
.memeimg .ov.red { color: #ff3b30; }
.score.neg b, .score.neg span { color: var(--brick); }
.freebtn { display: block; margin: 40px auto 8px; padding: 6px 10px; border: 0; background: none; color: var(--muted); opacity: .65; font: 400 14px/1.2 var(--body); text-decoration: underline; cursor: pointer; }
.memeimg .bot { bottom: 10px; }
.alertbox { margin: 14px 0; padding: 18px; border: 3px solid var(--brick); border-radius: 12px; background: var(--card); }
.alertbox b { display: block; color: var(--brick); font: 700 26px/1.1 var(--display); letter-spacing: .03em; text-transform: uppercase; margin-bottom: 8px; }
.alertbox p { margin: 0; }
.sticker { margin: 14px 0; padding: 22px 18px; border: 2.5px solid var(--ink); border-radius: 12px; background: var(--signal); color: var(--signal-ink); font: 700 34px/1.08 var(--display); }
.meme { border: 2.5px solid var(--ink); border-radius: 12px; overflow: hidden; margin: 14px 0; background: var(--card); }
.meme div { display: grid; grid-template-columns: 88px 1fr; align-items: center; min-height: 96px; }
.meme div + div { border-top: 2.5px solid var(--ink); }
.meme span { font-size: 56px; text-align: center; line-height: 1; }
.meme b { align-self: stretch; display: flex; align-items: center; padding: 12px 14px; font: 700 22px/1.15 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.meme div:first-child b { background: var(--paper); color: var(--muted); }
.meme div:last-child b { background: var(--signal); color: var(--signal-ink); align-self: stretch; display: flex; align-items: center; }
.qr { display: block; width: 100%; max-width: 230px; margin: 4px auto 12px; border-radius: 8px; background: #fff; }
.steps + .card { margin-top: 16px; }
.step::before { content: ""; position: absolute; left: -14px; top: -1px; width: 25px; height: 25px; box-sizing: border-box; border-radius: 50%; border: 3px solid var(--line); background: var(--paper); display: grid; place-items: center; font: 700 14px/1 var(--body); }
.step.done::before { content: "\2713"; background: var(--ok); border-color: var(--ok); color: #fff; }
.step.now::before { background: var(--signal); border-color: var(--ink); }
.st-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; min-height: 24px; }
.st-title { font: 700 21px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
.step.next .st-title { color: var(--muted); }
.st-sum { color: var(--muted); font-size: 16px; }
.st-body { margin-top: 10px; }
.st-body > :last-child { margin-bottom: 0; }
.qhead { display: flex; align-items: flex-start; gap: 12px; }

.qpts { flex: none; font: 700 18px/1 var(--display); letter-spacing: .04em; padding: 6px 9px; border-radius: 8px; border: 1.5px solid var(--line); white-space: nowrap; }
.minus { float: right; display: inline-block; margin-left: 10px; color: var(--brick); font-weight: 700; }
.score { display: flex; align-items: baseline; gap: 8px; margin: 6px 0 0; }
.score b { font: 700 52px/1 var(--display); }
.score span { font: 700 20px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
/* Ausblick am Ende der Liste: kein Schritt, sondern "danach geht es weiter" */
.step:has(+ .step.after) { border-left-style: dashed; }
.step.after::before { display: none; }
.step.after .st-title { font: 400 16px/1.4 var(--body); letter-spacing: 0; text-transform: none; color: var(--line); }
button.dot { padding: 0; margin: 0; cursor: pointer; }
.st-head.back { width: 100%; padding: 4px 0; margin: -4px 0; background: none; border: 0; color: inherit; text-align: left; cursor: pointer; font: inherit; }
.st-back { margin-left: auto; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

.btn { display: block; width: 100%; min-height: 58px; padding: 12px 16px; border-radius: 12px; border: 2.5px solid var(--ink); background: transparent; color: var(--ink); font: 700 22px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; text-align: center; margin: 0 0 10px; }
.btn.primary { background: var(--signal); border-color: var(--ink); color: var(--signal-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.small { min-height: 48px; font-size: 18px; }
.btn.opt { font: 600 20px/1.25 var(--body); letter-spacing: 0; text-transform: none; text-align: left; background: var(--card); }
.btn.opt:disabled { text-decoration: line-through; opacity: 1; color: var(--muted); border-color: var(--line); }

label.field { display: block; font-weight: 600; margin: 4px 0 6px; }
input[type="text"], input[type="password"] { width: 100%; min-height: 54px; padding: 10px 14px; font: 400 20px/1.3 var(--body); color: var(--ink); background: var(--card); border: 2.5px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
input[type="text"]:focus, input[type="password"]:focus { border-color: var(--focus); outline: none; }
body.locked .bar button { display: none; }
.check { display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 8px 4px; font-weight: 600; cursor: pointer; }
.check input { width: 30px; height: 30px; flex: none; accent-color: var(--ink); }
.msg { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); }
.msg.ok { border-color: var(--ok); }
.msg.bad { border-color: var(--brick); }
.row { display: flex; gap: 10px; }
.row > * { flex: 1; }
ul.plain { margin: 0 0 12px; padding-left: 20px; }
ul.plain li { margin-bottom: 8px; }
ol.logl { list-style: none; margin: 8px 0 14px; padding: 0; font-variant-numeric: tabular-nums; }
ol.logl li { padding: 6px 0; border-bottom: 1px solid var(--line); }

#sheet { position: fixed; inset: 0; z-index: 10; background: var(--paper); overflow-y: auto; }
#sheet[hidden] { display: none; }
.sheet-in { max-width: 560px; margin: 0 auto; padding: 16px 16px 60px; }
.sheet-in h2 { margin-top: 22px; }
a { color: var(--focus); }
@media (prefers-reduced-motion: no-preference) { .btn { transition: transform .08s; } .btn:active { transform: translateY(1px); } }
</style>
<body class="locked">

<script>
(function () {
  "use strict";

  /* Die Seite enthält keine Rallye-Inhalte im Klartext. Stationen, Rätsel, Fragen, Wildcards und
     Einstellungen liegen verschlüsselt im Block "vault" und werden erst mit dem Team-Passwort lesbar.
     Der Spielstand wird nur verschlüsselt im Browser gespeichert. */
  var VERSION = 6;
  var VAULT = {};
  try { VAULT = JSON.parse(document.getElementById("vault").textContent); } catch (e) {}

  var C = null;            /* entschlüsselter Inhalt */
  var stations = [], N = 0;
  var state = fresh();
  var sess = null;         /* { team, key } nach dem Entsperren */
  var ui = { confirmHelp: false, confirmReset: false, sheet: "info", booting: true, gateMsg: "", busy: false };

  /* ---------- Hilfsfunktionen ---------- */
  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function nowHM() { var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function top() { window.scrollTo(0, 0); }
  function cfg(k) { return (C && C.config && C.config[k]) || ""; }
  /* Punkte: pro Frage C.scoring.question, jeder Fehlversuch kostet C.scoring.wrong.
     Wildcards bringen je nach Stufe C.scoring.wild[stufe]. Ohne C.scoring gibt es keine Punkte. */
  function scoring() { return (C && C.scoring) || null; }
  function possible(st) {
    var S = scoring();
    return S ? Math.max(0, S.question - S.wrong * (state.wrong[st.id] || []).length) : 0;
  }
  function qPoints(st) { return st.q && state.solved[st.id] ? possible(st) : 0; }
  function wildPts(w) { var S = scoring(); return (S && S.wild && S.wild[w.lvl]) || 0; }
  function totals() {
    var t = { q: 0, w: 0, wrong: 0 };
    stations.forEach(function (s) { t.q += qPoints(s); t.wrong += (state.wrong[s.id] || []).length; });
    ((C && C.wild) || []).forEach(function (w) { if (state.wild[w.id]) t.w += wildPts(w); });
    t.e = eggPoints(1);
    t.g = eggPoints(-1);
    var ch = C && C.cheat;
    t.c = (ch && state.cheats >= (ch.after || 3)) ? (ch.points || 0) : 0;
    t.all = t.q + t.w + t.e + t.g + t.c;
    return t;
  }
  function eyebrow(label) {
    return "<p class=\"eyebrow\"><span>" + label + "</span>" + (scoring() ? "<span>" + minus(totals().all) + " points</span>" : "") + "</p>";
  }
  function teamInfo() { return (sess && C && C.teams && C.teams[sess.team]) || {}; }
  function rulesList() {
    if (!C.rules || !C.rules.length) return "";
    var h = "<ul class=\"plain\">";
    C.rules.forEach(function (r) { h += "<li>" + esc(r) + "</li>"; });
    return h + "</ul>";
  }
  function contactHtml() {
    var c = teamInfo().contact;
    if (!c || !c.phone) return "";
    var digits = c.phone.replace(/[^0-9]/g, "");
    if (c.via === "whatsapp") return "<p>Lost your group? Message " + esc(c.name || "your guide") + " on WhatsApp: <a href=\"https://wa.me/" + digits + "\"><b>" + esc(c.phone) + "</b></a></p>";
    return "<p>Lost your group? Call " + esc(c.name || "your guide") + ": <a href=\"tel:+" + digits + "\"><b>" + esc(c.phone) + "</b></a></p>";
  }
  function groupCardWa() {
    var link = cfg("groupLink"), qr = cfg("groupQr");
    if (!link && !qr) return "";
    var h = "<div class=\"card\"><span class=\"tag\">WhatsApp group</span>";
    h += "<p>" + esc(cfg("groupText") || "Join the WhatsApp group to stay in touch during the rally.") + "</p>";
    if (qr) h += "<img class=\"qr\" src=\"" + esc(qr) + "\" alt=\"QR code for the WhatsApp group\">";
    if (link) h += "<a class=\"btn small\" style=\"margin:0;text-decoration:none;line-height:22px\" href=\"" + esc(link) + "\" target=\"_blank\" rel=\"noopener\">Join the WhatsApp group</a>";
    return h + "</div>";
  }
  /* Versteckte Boni. Auslöser, Texte und Bilder stehen verschlüsselt in C.eggs:
     taps (mehrfach auf den Titel tippen), wild (bestimmte Wildcard erledigt),
     teamname (Teamname enthält ein Wort, je Team festgelegt). Jeder zählt einmal. */
  var tapTimes = {};
  /* Zählt Tipps je Auslöser; true, sobald genug Tipps im Zeitfenster liegen */
  function countTap(key, need, win) {
    var now = Date.now();
    tapTimes[key] = (tapTimes[key] || []).filter(function (t) { return now - t < win; });
    tapTimes[key].push(now);
    var n = tapTimes[key].length;
    if (n >= need) tapTimes[key] = [];
    return n;
  }
  /* Rückmeldung, die mit jedem Tipp deutlicher wird: Wackeln und ein aufsteigendes Ei */
  function toast(text, level) {
    var old = document.querySelector(".toast");
    if (old) old.parentNode.removeChild(old);
    var t = document.createElement("div");
    t.className = "toast";
    t.setAttribute("role", "status");
    t.textContent = text;
    var long = text.length > 14, lvl = level || 1;
    if (long) t.className += " long";
    t.className += " t" + lvl;
    document.body.appendChild(t);
    if (lvl >= 3) { var w = document.querySelector(".wrap"); w.classList.remove("quake"); void w.offsetWidth; w.classList.add("quake"); }
    var ms = (long ? 1900 : 1100) + (lvl - 1) * 300;
    setTimeout(function () { t.style.opacity = "0"; }, ms);
    setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, ms + 400);
  }
  /* Rückmeldung bei Mehrfach-Tipps: das Element kippt mit jedem Tipp weiter, beim letzten fällt es herunter.
     Ohne weitere Tipps richtet es sich nach Ablauf des Zeitfensters wieder auf. */
  var leanTimers = {};
  function lean(key, el, n, need, win, onDone) {
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    clearTimeout(leanTimers[key]);
    if (!el || reduce) { if (n >= need) onDone(); return; }
    el.style.transformOrigin = "left bottom";
    if (n >= need) {
      el.classList.remove("jig");
      el.style.transition = "transform .6s cubic-bezier(.55,0,.9,.45), opacity .6s ease-in";
      el.style.transform = "translateY(160px) rotate(80deg)";
      el.style.opacity = "0";
      setTimeout(function () {
        onDone();
        setTimeout(function () { straighten(el, true); }, 300);
      }, 600);
      return;
    }
    var deg = Math.round(16 * n / need);
    el.style.setProperty("--d", deg + "deg");
    el.style.setProperty("--y", n + "px");
    el.style.transition = "transform .3s ease-out";
    el.style.transform = "rotate(" + deg + "deg) translateY(" + n + "px)";
    el.classList.remove("jig"); void el.offsetWidth; el.classList.add("jig");
    leanTimers[key] = setTimeout(function () { tapTimes[key] = []; straighten(el); }, win);
  }
  function straighten(el, instant) {
    el.classList.remove("jig");
    el.style.transition = instant ? "none" : "transform 1.2s ease";
    el.style.transform = "";
    el.style.opacity = "";
  }
  function eggs() { return (C && C.eggs) || []; }
  function eggPoints(sign) {
    var p = 0;
    eggs().forEach(function (e) {
      var v = e.points || 0;
      if (state.eggs[e.id] && (sign > 0 ? v > 0 : v < 0)) p += v;
    });
    return p;
  }
  /* Zeile im Logbuch für Punktabzüge, Text aus dem verschlüsselten Inhalt (logLine, {p} = Punkte) */
  function penaltyLine(n) {
    var e = eggs().filter(function (x) { return (x.points || 0) < 0 && state.eggs[x.id] && x.logLine; })[0];
    return e ? e.logLine.replace("{p}", minus(n)) : "Other: " + minus(n) + " points";
  }
  function minus(n) { return n < 0 ? "\u2212" + Math.abs(n) : String(n); }
  function eggFor(e) {
    var o = e.byTeam && sess && e.byTeam[sess.team], r = {};
    Object.keys(e).forEach(function (k) { r[k] = e[k]; });
    if (o) Object.keys(o).forEach(function (k) { r[k] = o[k]; });
    return r;
  }
  /* Wörter, die ein Team nicht im Namen tragen darf (Name der Konkurrenz) */
  function bannedWords() {
    var w = [];
    eggs().forEach(function (eg) { if (eg.trigger === "teamname" && eg.words && eg.words[sess.team]) w = w.concat(eg.words[sess.team]); });
    return w;
  }
  function nameAllowed(name) {
    var n = (name || "").toLowerCase();
    return !bannedWords().some(function (w) { return n.indexOf(w) >= 0; });
  }
  function findEgg(e) {
    e = eggFor(e);
    var first = !state.eggs[e.id];
    state.eggs[e.id] = true;
    save(); render();
    if (!$("#sheet").hidden) renderSheet();
    showEgg(e, first);
  }
  function showEgg(e, first) {
    if (!first && e.repeat) {
      var r = e.repeat, hr = "";
      if (r.eyebrow) hr += "<p class=\"eyebrow\"><span>" + esc(r.eyebrow) + "</span></p>";
      hr += "<h1>" + esc(r.title || "") + "</h1>";
      if (r.image) hr += "<div class=\"memeimg\" style=\"background:#fff\"><img src=\"" + esc(r.image) + "\" alt=\"\"></div>";
      if (r.text) hr += "<p>" + esc(r.text) + "</p>";
      hr += "<button class=\"btn small\" data-act=\"egg-close\">Back to the rally</button>";
      $("#egg-body").innerHTML = hr;
      $("#egg").hidden = false;
      $("#egg").scrollTop = 0;
      return;
    }
    var neg = (e.points || 0) < 0;
    var h = neg ? "" : "<div class=\"flyby\" aria-hidden=\"true\">\u2708\ufe0f</div>";
    h += "<p class=\"eyebrow\"><span>" + (neg ? (first ? "Nice try" : "Again?") : (first ? "You found it" : "Found it already")) + "</span></p>";
    h += "<h1>" + esc(e.title || "Surprise!") + "</h1>";
    h += "<div class=\"score" + (neg ? " neg" : "") + "\"><b>" + (neg ? minus(e.points) : "+" + (e.points || 0)) + "</b><span>points</span></div>";
    if (!first) h += "<p class=\"muted\">" + (neg ? "We only take them once." : "These points only count once.") + "</p>";
    if (e.image) {
      h += "<div class=\"memeimg\"><img src=\"" + esc(e.image) + "\" alt=\"\">";
      if (e.top) h += "<b class=\"top\">" + esc(e.top) + "</b>";
      if (e.bottom) h += "<b class=\"bot\">" + esc(e.bottom) + "</b>";
      (e.overlays || []).forEach(function (o) {
        h += "<b class=\"ov" + (o.red ? " red" : "") + "\" style=\"left:" + (+o.x) + "%;top:" + (+o.y) + "%\">" + esc(o.t) + "</b>";
      });
      h += "</div>";
    }
    if (e.sticker) h += "<div class=\"sticker\">" + esc(e.sticker) + "</div>";
    if (e.alert) h += "<div class=\"alertbox\"><b>" + esc(e.alert.head) + "</b><p>" + esc(e.alert.body) + "</p></div>";
    if (e.meme && e.meme.length) {
      h += "<div class=\"meme\">";
      e.meme.forEach(function (m) { h += "<div><span aria-hidden=\"true\">" + esc(m.face) + "</span><b>" + esc(m.text) + "</b></div>"; });
      h += "</div>";
    }
    if (e.text) h += "<p>" + esc(e.text) + "</p>";
    h += "<button class=\"btn small\" data-act=\"egg-close\">Back to the rally</button>";
    $("#egg-body").innerHTML = h;
    $("#egg").hidden = false;
    $("#egg").scrollTop = 0;
  }
  function wildCount() { return Object.keys(state.wild).filter(function (k) { return state.wild[k]; }).length; }

  /* ---------- Verschlüsselung ---------- */
  function b64(buf) { var s = "", u = new Uint8Array(buf); for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function unb64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function derive(pw) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pw.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]).then(function (base) {
      return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(VAULT.salt), iterations: VAULT.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    });
  }
  function decryptRaw(key, iv, ct) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(iv) }, key, unb64(ct)); }
  function decryptText(key, iv, ct) { return decryptRaw(key, iv, ct).then(function (b) { return new TextDecoder().decode(b); }); }
  function encryptText(key, text) {
    var iv = crypto.getRandomValues(new Uint8Array(12));
    return crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, new TextEncoder().encode(text)).then(function (ct) { return { iv: b64(iv), ct: b64(ct) }; });
  }
  /* Der Passwort-Schlüssel öffnet genau einen Eintrag in VAULT.slots. Darin stehen das Team und der
     Inhaltsschlüssel. Die übrigen Einträge gehören anderen Teams oder sind Füllwerte. Schlägt fehl,
     wenn das Passwort zu keinem Eintrag passt. */
  function findSlot(key) {
    var slots = VAULT.slots || [];
    return new Promise(function (res, rej) {
      var k = 0;
      (function next() {
        if (k >= slots.length) { rej(new Error("no slot")); return; }
        var s = slots[k++];
        decryptText(key, s.iv, s.ct).then(function (t) { res(JSON.parse(t)); }, next);
      })();
    });
  }
  function openVault(key) {
    var team;
    return findSlot(key).then(function (slot) {
      team = slot.t;
      return crypto.subtle.importKey("raw", unb64(slot.k), "AES-GCM", false, ["decrypt"]);
    }).then(function (cek) {
      return decryptText(cek, VAULT.content.iv, VAULT.content.ct);
    }).then(function (t) { return { team: team, content: JSON.parse(t) }; });
  }

  /* ---------- Spielstand ---------- */
  function storeKey(team) { return "innovaero-rallye-v" + VERSION + "-" + team; }
  function fresh() {
    return { v: VERSION, team: "", i: 0, phase: "here", solved: {}, wrong: {}, helped: {}, photo: {}, groupDone: {}, sub: {}, eggs: {}, cheats: 0, bonus: false, bonusWrong: [], wild: {}, times: {}, finish: "" };
  }
  function valid(d) { return d && d.v === VERSION && typeof d.i === "number" && d.i >= 0 && d.i < stations.length; }
  function loadState() {
    var raw = null, box;
    try { raw = localStorage.getItem(storeKey(sess.team)); } catch (e) {}
    if (!raw) return Promise.resolve(null);
    try { box = JSON.parse(raw); } catch (e) { return Promise.resolve(null); }
    return decryptText(sess.key, box.iv, box.ct).then(function (t) {
      var d = JSON.parse(t);
      if (!valid(d)) return null;
      d.groupDone = d.groupDone || {};
      d.sub = d.sub || {};
      d.eggs = d.eggs || {};
      d.cheats = d.cheats || 0;
      if (d.egg) { d.eggs.logo = true; delete d.egg; }
      d.maxI = (typeof d.maxI === "number" && d.maxI < stations.length) ? d.maxI : d.i;
      return d;
    }).catch(function () { return null; });
  }
  var saving = Promise.resolve();
  function save() {
    if (!sess) return;
    var s = sess, text = JSON.stringify(state);
    saving = saving.then(function () { return encryptText(s.key, text); }).then(function (box) {
      try { localStorage.setItem(storeKey(s.team), JSON.stringify(box)); } catch (e) {}
    }).catch(function () {});
  }

  /* Der Team-Schlüssel wird als nicht exportierbares Objekt in IndexedDB gemerkt,
     damit das Passwort auf einem Handy nur einmal eingegeben werden muss. */
  function idb(mode, fn) {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("innovaero-rallye", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("k"); };
      r.onerror = function () { rej(r.error); };
      r.onsuccess = function () {
        var db = r.result, tx = db.transaction("k", mode), q = fn(tx.objectStore("k"));
        tx.oncomplete = function () { db.close(); res(q.result); };
        tx.onerror = tx.onabort = function () { db.close(); rej(tx.error); };
      };
    });
  }
  function remember(key) { return idb("readwrite", function (s) { return s.put({ key: key }, "session"); }).catch(function () {}); }
  function recall() { return idb("readonly", function (s) { return s.get("session"); }).catch(function () { return null; }); }
  function forget() { return idb("readwrite", function (s) { return s.delete("session"); }).catch(function () {}); }

  /* Eine Station kann je Team abweichen: "byTeam": { "boeing": { "riddle": ... } } */
  function setContent(c, team) {
    C = c;
    stations = (c.stations || []).map(function (s) {
      var r = {}, o = s.byTeam && s.byTeam[team];
      Object.keys(s).forEach(function (k) { if (k !== "byTeam") r[k] = s[k]; });
      if (o) Object.keys(o).forEach(function (k) { r[k] = o[k]; });
      return r;
    });
    stations.forEach(function (s, i) { s.idx = i; s.num = (s.kind === "stop") ? i : 0; });
    N = stations.length - 2;
  }
  function openSession(key, store) {
    return openVault(key).then(function (v) {
      setContent(v.content, v.team);
      sess = { team: v.team, key: key };
      return loadState();
    }).then(function (d) {
      state = d || fresh();
      if (!nameAllowed(state.team)) state.team = "";
      ui.busy = false; ui.booting = false; ui.gateMsg = "";
      if (store) remember(key);
      render(); top();
    });
  }
  function unlock(pw) {
    if (!pw || !pw.trim()) { ui.gateMsg = "Please enter the password."; render(); return; }
    ui.busy = true; ui.gateMsg = ""; render();
    derive(pw).then(function (key) { return openSession(key, true); }).catch(function () {
      ui.busy = false; ui.fails = (ui.fails || 0) + 1; ui.gateMsg = "That password does not work. Please try again."; render();
      var p = $("#pw"); if (p) p.focus();
    });
  }

  /* ---------- Darstellung ---------- */
  function reached() { return Math.max(state.maxI || 0, state.i); }
  function renderRoute() {
    var h = "", maxI = reached();
    for (var k = 0; k < stations.length; k++) {
      var label = k === 0 ? "S" : (k === stations.length - 1 ? "Z" : String(k));
      var cur = k === state.i && state.phase !== "finished";
      var cls = cur ? "now" : (k <= maxI ? "done" : "");
      var nav = k <= maxI && k !== state.i;
      h += "<li class=\"" + cls + "\">" + (nav
        ? "<button class=\"dot\" data-act=\"goto\" data-k=\"" + k + "\" aria-label=\"Go to " + esc(stations[k].name) + "\">" + label + "</button>"
        : "<span class=\"dot\"" + (k > maxI ? " data-act=\"locked\"" : "") + ">" + label + "</span>") + "</li>";
    }
    $("#route").innerHTML = h;
  }
  function renderHeader() {
    document.body.classList.toggle("locked", !sess);
    $("#wn").textContent = String(wildCount());
    $("#teamline").textContent = (sess && state.team) ? state.team : (sess ? (teamInfo().label || C.subtitle || "") : "City Rally");
    $("#clock").textContent = nowHM();
  }

  function renderGate() {
    $("#route").innerHTML = "";
    var h;
    if (ui.booting) {
      h = "<p class=\"eyebrow\">Start</p><h1>One moment</h1><p class=\"muted\">Loading the rally.</p>";
    } else if (!VAULT.slots || !VAULT.content) {
      h = "<p class=\"eyebrow\">Start</p><h1>Not ready yet</h1><p class=\"lead\">The rally has not been set up yet.</p>";
    } else {
      h = "<p class=\"eyebrow\">Start</p><h1>Password</h1>";
      h += "<p class=\"lead\">Enter the password you got at the briefing.</p>";
      h += "<form id=\"gate\" novalidate><label class=\"field\" for=\"pw\">Password</label>";
      h += "<input type=\"password\" id=\"pw\" autocomplete=\"current-password\" autocapitalize=\"none\" autocorrect=\"off\" spellcheck=\"false\"" + (ui.busy ? " disabled" : "") + ">";
      if (ui.forgot) h += "<div class=\"warn\"><b>Seriously?</b> You got this password at the briefing. Minutes ago. Out loud. From a real human. There is no reset link. There is no email. There is only shame. Fine. Walk over to your guide, look them in the eyes, and ask nicely.</div>";
      else if (ui.gateMsg) h += "<p class=\"msg bad\">" + esc(ui.gateMsg) + "</p>";
      h += "<button class=\"btn primary\" type=\"submit\"" + (ui.busy ? " disabled" : "") + ">" + (ui.busy ? "Checking" : "Unlock") + "</button></form>";
      if (!ui.forgot) h += "<p class=\"muted\">You only need to enter it once on this phone. Upper or lower case does not matter.</p>";
      if (!ui.forgot && (ui.fails || 0) >= 3) h += "<button class=\"btn small\" data-act=\"forgot\">Forgot password?</button>";
    }
    $("#stage").innerHTML = h;
  }

  function renderTravel(st) {
    var label = st.kind === "finish" ? "On the way to the finish" : "On the way to stop " + st.num;
    var h = eyebrow(st.kind === "finish" ? "Last leg" : "Stop " + st.num + " of " + N);
    h += "<h1>" + label + "</h1>";
    h += "<div class=\"clue\"><div class=\"label\">Clue</div><p class=\"txt\">" + esc(st.riddle) + "</p></div>";
    if (st.travelNote) h += "<p class=\"note\">" + esc(st.travelNote) + "</p>";
    if (st.eta) h += "<p class=\"muted\">Rough time: " + esc(st.eta) + ".</p>";
    h += "<button class=\"btn primary\" data-act=\"arrive\">We are here</button>";
    if (state.helped[st.id]) {
      h += "<div class=\"msg\">Your destination: <b>" + esc(st.name) + "</b></div>";
    } else if (ui.confirmHelp) {
      h += "<div class=\"msg\">Reveal the destination now?</div><div class=\"row\"><button class=\"btn small\" data-act=\"help-yes\">Yes, reveal it</button><button class=\"btn small\" data-act=\"help-no\">Cancel</button></div>";
    } else {
      h += "<button class=\"btn small\" data-act=\"help-ask\">Reveal destination</button>";
    }
    $("#stage").innerHTML = h;
  }

  function groupCard(st, label, act) {
    var text = st.groupPhoto === true ? "Everyone together in the picture." : st.groupPhoto;
    return "<div class=\"group\"><p>" + esc(text) + "</p></div>" +
      "<button class=\"btn primary\" data-act=\"" + act + "\" data-id=\"" + esc(st.id) + "\">" + esc(label) + "</button>";
  }

  function ready(st) {
    if (st.motif && !state.photo[st.id]) return false;
    if (st.q && !state.solved[st.id]) return false;
    return true;
  }

  function choiceBlock(q, solved, wrongList, act, suffix, minus) {
    var h = "";
    if (solved) return "<p class=\"msg ok\">Correct: " + esc(q.answer) + esc(suffix || "") + "</p>";
    q.opts.forEach(function (o, k) {
      var off = wrongList.indexOf(k) >= 0;
      h += "<button class=\"btn opt\" data-act=\"" + act + "\" data-k=\"" + k + "\"" + (off ? " disabled" : "") + ">" + esc(o) +
        (off && minus ? "<span class=\"minus\">\u2212" + minus + "</span>" : "") + "</button>";
    });
    if (wrongList.length) h += "<p class=\"msg bad\">Nicht ganz. Probiert eine andere Antwort.</p>";
    return h;
  }

  /* Eine Station ist eine Schrittliste auf einer Seite. Alle Schritte stehen von Anfang an da:
     erledigte als eine Zeile mit Haken, der aktuelle aufgeklappt, kommende grau. Nichts wird
     angehängt, nichts scrollt von selbst.
       intro   Begrüßung (nur am Start)
       task    Frage
       gather  Zusammenkommen, ggf. Wildcard-Tipp für die Wartezeit
       photo   Gruppenfoto (falls vorgesehen)
     Der Knopf des letzten Schritts zeigt das Rätsel für die nächste Etappe. */
  var STEP_TITLE = { intro: "Welcome", task: "Question", gather: "Regroup", photo: "Time for a group photo" };

  function steps(st) {
    var s = [];
    if (st.kind === "start") s.push("intro");
    if (st.q || st.motif) s.push("task");
    if (st.kind === "stop") s.push("gather");
    if (st.groupPhoto) s.push("photo");
    return s;
  }
  function stepIndex(st) { return Math.min(state.sub[st.id] || 0, steps(st).length - 1); }
  function nextTitle(st) {
    if (st.kind === "start") return "First clue";
    var nx = stations[st.idx + 1];
    return nx && nx.kind === "finish" ? "Clue for the finish" : "Next clue";
  }
  function afterText(st) {
    if (st.kind === "start") return "Then off we go with the first clue";
    var nx = stations[st.idx + 1];
    return nx && nx.kind === "finish" ? "Then on to the finish" : "Then on to the next stop";
  }
  function stepButton(label) { return "<button class=\"btn primary\" data-act=\"step\">" + esc(label) + "</button>"; }

  function stepSummary(st, step) {
    if (step === "intro") return state.team ? "Team " + state.team : "";
    if (step === "task") return st.q ? "Correct: " + st.q.answer + (scoring() ? ", " + qPoints(st) + " pts" : "") : "";
    if (step === "gather") return "All here";
    if (step === "photo") return "Done";
    return "";
  }

  function stepBody(st, step, last) {
    var h = "";
    if (step === "intro") {
      if (st.intro) h += "<p class=\"lead\">" + esc(st.intro) + "</p>";
      h += rulesList();
      h += groupCardWa();
      h += "<label class=\"field\" for=\"team\">Team name (optional)</label><input type=\"text\" id=\"team\" maxlength=\"40\" autocomplete=\"off\" value=\"" + esc(state.team) + "\" placeholder=\"Optional\">";
      if (ui.nameMsg) h += "<p class=\"msg bad\">" + esc(ui.nameMsg) + "</p>";
      h += stepButton(last ? "Show " + nextTitle(st).toLowerCase() : "Next");
    } else if (step === "task") {
      if (st.note) h += "<p class=\"note\">" + esc(st.note) + "</p>";
      if (st.motif) {
        h += "<div class=\"card\"><span class=\"tag\">" + esc(st.photoTag || "Motivaufgabe") + "</span><p>" + esc(st.motif) + "</p>";
        h += "<label class=\"check\" style=\"margin-bottom:-8px\"><input type=\"checkbox\" id=\"photo\"" + (state.photo[st.id] ? " checked" : "") + "><span>Photo taken</span></label></div>";
      }
      if (st.q) {
        var solvedQ = state.solved[st.id] === true, S = scoring();
        h += "<div class=\"card\"><div class=\"qhead\"><p>" + esc(st.q.text) + "</p>" +
          (S ? "<span class=\"qpts\">" + (solvedQ ? qPoints(st) : S.question) + " pts</span>" : "") + "</div>";
        h += choiceBlock(st.q, solvedQ, state.wrong[st.id] || [], "pick", "", S ? S.wrong : 0);
        h += "</div>";
      }
      if (ready(st)) h += stepButton(last ? "Show " + nextTitle(st).toLowerCase() : "Next");
    } else if (step === "gather") {
      h += "<p>Go to your guide. When everyone is here, we move on together. This time, a different subgroup leads the way to the next stop.</p>";
      if (st.wildHint) {
        h += "<div class=\"card\"><span class=\"tag\">Wildcard, optional</span><p>Lots of people around here. While you wait for the others, this is a good moment for a wildcard.</p><button class=\"btn small\" data-act=\"wild-open\" style=\"margin:0\">See wildcards</button></div>";
      }
      h += stepButton(last ? "Show " + nextTitle(st).toLowerCase() : "Everyone is here");
    } else if (step === "photo") {
      h += groupCard(st, "Photo taken", "step");
    }
    return h;
  }

  function stepItem(cls, title, summary, body, back) {
    var head = "<span class=\"st-title\">" + esc(title) + "</span>";
    if (summary) head += "<span class=\"st-sum\">" + esc(summary) + "</span>";
    var h = "<li class=\"step " + cls + "\">";
    if (back !== undefined) h += "<button class=\"st-head back\" data-act=\"goto-step\" data-k=\"" + back + "\">" + head + "<span class=\"st-back\">back</span></button>";
    else h += "<div class=\"st-head\">" + head + "</div>";
    if (body) h += "<div class=\"st-body\">" + body + "</div>";
    return h + "</li>";
  }

  function renderHere(st) {
    var first = st.kind === "start";
    var list = steps(st), k = stepIndex(st);
    var h = eyebrow(first ? "Start" : "Stop " + st.num + " of " + N) + "<h1>" + esc(st.name) + "</h1>";
    h += "<ol class=\"steps\">";
    list.forEach(function (s, i) {
      if (i < k) h += stepItem("done", STEP_TITLE[s], stepSummary(st, s), "", i);
      else if (i === k) h += stepItem("now", STEP_TITLE[s], "", stepBody(st, s, i === list.length - 1));
      else h += stepItem("next", STEP_TITLE[s]);
    });
    h += stepItem("after", afterText(st));
    h += "</ol>";
    $("#stage").innerHTML = h;
  }

  function logbook() {
    var h = "<div class=\"card log\"><span class=\"tag\">Logbook</span><h2>" + esc(state.team || teamInfo().label || "Your team") + "</h2>";
    if (state.team && teamInfo().label) h += "<p class=\"muted\" style=\"margin:0\">" + esc(teamInfo().label) + "</p>";
    if (scoring()) {
      var t = totals();
      h += "<div class=\"score\"><b data-act=\"score-tap\">" + minus(t.all) + "</b><span>points</span></div>";
      h += "<p class=\"muted\" style=\"margin:0 0 8px\">Questions: " + t.q + " points" + (t.wrong ? " (" + t.wrong + (t.wrong === 1 ? " wrong answer" : " wrong answers") + ")" : "") + "<br>Wildcards: " + t.w + " points" + (t.e ? "<br>Bonus: " + t.e + " points" : "") + (t.g ? "<br>" + esc(penaltyLine(t.g)) : "") + (t.c ? "<br>" + esc((C.cheat.logLine || "Penalty: {p} points").replace("{p}", minus(t.c))) : "") + "</p>";
    }
    if (C.dateLine) h += "<p class=\"muted\">" + esc(C.dateLine) + "</p>";
    h += "<ol class=\"logl\">";
    stations.forEach(function (s) {
      var t = state.times[s.id];
      if (t) h += "<li><b>" + esc(t) + "</b> " + esc(s.name) + (s.kind === "start" ? " (Start)" : "") + "</li>";
    });
    h += "</ol>";
    var done = (C.wild || []).filter(function (w) { return state.wild[w.id]; });
    if (done.length) {
      h += "<p style=\"margin:0\"><b>Wildcards</b></p><ul class=\"plain\" style=\"margin:4px 0 0\">";
      done.forEach(function (w) { h += "<li>" + esc(w.short) + (wildPts(w) ? ", " + wildPts(w) + " points" : "") + "</li>"; });
      h += "</ul>";
    } else {
      h += "<p class=\"muted\" style=\"margin:0\">No wildcards this time. That is completely fine.</p>";
    }
    h += "</div>";
    return h;
  }

  function after() {
    var a = C.after;
    if (!a) return "";
    var h = "<h2>" + esc(a.h || "Afterwards") + "</h2>";
    if (a.p) h += "<p>" + esc(a.p) + "</p>";
    if (a.items && a.items.length) {
      h += "<ul class=\"plain\">";
      a.items.forEach(function (it) { h += "<li>" + (it.b ? "<b>" + esc(it.b) + ":</b> " : "") + esc(it.t) + "</li>"; });
      h += "</ul>";
    }
    if (cfg("meetup")) h += "<p><b>" + esc(cfg("meetup")) + "</b></p>";
    return h;
  }

  function renderFinish() {
    var n = wildCount();
    var ziel = stations[stations.length - 1];
    var h = eyebrow("Finish") + "<h1>You made it" + (state.team ? ", " + esc(state.team) : "") + "</h1>";
    h += "<p class=\"lead\">Arrived at <b>" + esc(state.finish) + "</b>." + (ziel.arrival ? " " + esc(ziel.arrival) : "") + "</p>";
    if (ziel.groupPhoto) {
      var pd = !!state.groupDone[ziel.id];
      h += "<ol class=\"steps\">" + (pd ? stepItem("done", STEP_TITLE.photo, "Done", "", "photo")
        : stepItem("now", STEP_TITLE.photo, "", groupCard(ziel, "Photo taken", "group-done")) + stepItem("after", "Then your logbook")) + "</ol>";
      if (!pd) { $("#stage").innerHTML = h; return; }
    }
    if (cfg("reward")) h += "<div class=\"card\"><span class=\"tag\">For you</span><p style=\"margin:0\">" + esc(cfg("reward")) + "</p></div>";
    if (cfg("wildReward") && n > 0) h += "<div class=\"card\"><span class=\"tag\">For your wildcards</span><p style=\"margin:0\">You completed " + (n === 1 ? "one wildcard" : n + " wildcards") + ". " + esc(cfg("wildReward")) + "</p></div>";
    h += logbook();
    h += "<p class=\"muted\">Take a screenshot of your logbook as a souvenir" + (scoring() ? " and compare your points with the other teams." : ".") + "</p>";
    h += after();
    $("#stage").innerHTML = h;
  }

  function render() {
    renderHeader();
    if (!sess) { renderGate(); return; }
    renderRoute();
    var st = stations[state.i];
    if (state.phase === "finished") renderFinish();
    else if (st.kind !== "start" && state.phase === "travel") renderTravel(st);
    else renderHere(st);
  }

  function infoSheet() {
    var h = "<button class=\"btn primary\" data-act=\"sheet-close\">Back to the rally</button>";
    if (C.rules) h += "<h2>How it works</h2>" + rulesList();
    (C.info || []).forEach(function (sec) {
      h += "<h2>" + esc(sec.h) + "</h2>";
      if (sec.p) h += "<p>" + esc(sec.p) + "</p>";
      if (sec.list) { h += "<ul class=\"plain\">"; sec.list.forEach(function (li) { h += "<li>" + esc(li) + "</li>"; }); h += "</ul>"; }
    });
    h += "<h2>Help</h2><p>" + esc(cfg("help") || "If you are stuck or something comes up, talk to your guide.") + "</p>";
    h += contactHtml();
    var wa = groupCardWa();
    if (wa) h += "<h2>WhatsApp group</h2>" + wa;
    h += "<h2>Progress</h2><p>Your progress is saved on this phone. It stays even if you reload the page or close the browser.</p>";
    h += "<h2>Start over</h2>";
    if (ui.confirmReset) h += "<p class=\"msg bad\">All progress on this phone will be lost.</p><div class=\"row\"><button class=\"btn small\" data-act=\"reset-yes\">Yes, reset</button><button class=\"btn small\" data-act=\"reset-no\">Cancel</button></div>";
    else h += "<button class=\"btn small\" data-act=\"reset-ask\">Reset progress</button>";
    return h;
  }

  function wildSheet() {
    var h = "<button class=\"btn primary\" data-act=\"sheet-close\">Back to the rally</button>";
    h += "<h2>Wildcards</h2><p>Optional extra challenges for bonus points. Your team decides if and which ones, and you can do them any time along the way. Tap the button once you have done one.</p>";
    var wild = C.wild || [], levels = [];
    wild.forEach(function (w) { if (levels.indexOf(w.lvl) < 0) levels.push(w.lvl); });
    levels.forEach(function (lvl) {
      var lp = scoring() && scoring().wild ? scoring().wild[lvl] : 0;
      h += "<h3>" + esc(lvl) + (lp ? ", " + lp + " points each" : "") + "</h3>";
      wild.filter(function (w) { return w.lvl === lvl; }).forEach(function (w) {
        var on = !!state.wild[w.id];
        h += "<div class=\"card" + (on ? " done" : "") + "\"><p>" + esc(w.t) + "</p>";
        h += "<button class=\"btn small\" data-act=\"wild-toggle\" data-id=\"" + esc(w.id) + "\" style=\"margin:0\">" + (on ? "Done, tap to undo" : "We did it") + "</button></div>";
      });
    });
    var fp = eggs().filter(function (x) { return x.trigger === "free"; })[0];
    if (fp && fp.label) h += "<button class=\"freebtn\" data-act=\"free-points\">" + esc(fp.label) + "</button>";
    return h;
  }

  function renderSheet() { $("#sheet-body").innerHTML = ui.sheet === "wild" ? wildSheet() : infoSheet(); }
  function openSheet(kind) { ui.sheet = kind; renderSheet(); $("#sheet").hidden = false; $("#sheet").scrollTop = 0; }

  /* ---------- Aktionen ---------- */
  function go(act, el) {
    if (act === "forgot") { ui.forgot = true; render(); return; }
    if (!sess) return;
    if (act === "egg-close") { $("#egg").hidden = true; return; }
    if (act === "locked") {
      el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope");
      if (countTap("locked", 3, 4000) >= 3) {
        var ch = C.cheat || {}, msgs = ch.messages || ["NO CHEATING!"];
        state.cheats = (state.cheats || 0) + 1;
        save(); render();
        toast(msgs[Math.min(state.cheats, msgs.length) - 1], Math.min(state.cheats, 3));
      }
      return;
    }
    if (act === "score-tap" || act === "free-points") {
      var trig = act === "score-tap" ? "score" : "free";
      var eg = eggs().filter(function (x) { return x.trigger === trig; })[0];
      if (!eg) return;
      if (trig === "score") {
        var need = eg.taps || 5, win = eg.window || 5000, n = countTap("score", need, win);
        lean("score", el, n, need, win, function () { findEgg(eg); });
        return;
      }
      findEgg(eg);
      return;
    }
    var st = stations[state.i];
    if (act === "arrive") {
      if (!state.times[st.id]) state.times[st.id] = nowHM();
      if (st.kind === "finish") { state.phase = "finished"; if (!state.finish) state.finish = nowHM(); }
      else state.phase = "here";
      ui.confirmHelp = false;
      save(); render(); top();
    } else if (act === "goto-step") {
      if (state.phase === "finished") state.groupDone[st.id] = false;
      else state.sub[st.id] = parseInt(el.getAttribute("data-k"), 10) || 0;
      save(); render();
    } else if (act === "goto") {
      var gi = parseInt(el.getAttribute("data-k"), 10), gs = stations[gi];
      if (!gs || gi > reached()) return;
      state.maxI = reached();
      state.i = gi;
      if (gs.kind === "finish") state.phase = state.finish ? "finished" : "travel";
      else if (gs.kind === "start" || state.times[gs.id]) state.phase = "here";
      else state.phase = "travel";
      ui.confirmHelp = false;
      save(); render(); top();
    } else if (act === "group-done") { state.groupDone[el.getAttribute("data-id")] = true; save(); render(); top();
    } else if (act === "help-ask") { ui.confirmHelp = true; render();
    } else if (act === "help-no") { ui.confirmHelp = false; render();
    } else if (act === "help-yes") { state.helped[st.id] = true; ui.confirmHelp = false; save(); render();
    } else if (act === "pick") {
      var k = parseInt(el.getAttribute("data-k"), 10);
      if (k === st.q.correct) {
        state.solved[st.id] = true;
        var L = steps(st), j = stepIndex(st);
        if (L[j] === "task" && ready(st) && j + 1 < L.length) state.sub[st.id] = j + 1;
      }
      else { var w = state.wrong[st.id] || []; if (w.indexOf(k) < 0) w.push(k); state.wrong[st.id] = w; }
      save(); render();
    } else if (act === "pick-bonus") {
      var kb = parseInt(el.getAttribute("data-k"), 10);
      if (kb === st.bonus.correct) { state.bonus = true; }
      else if (state.bonusWrong.indexOf(kb) < 0) { state.bonusWrong.push(kb); }
      save(); render();
    } else if (act === "step") {
      var list = steps(st), k = stepIndex(st);
      if (list[k] === "task" && !ready(st)) return;
      if (k + 1 < list.length) state.sub[st.id] = k + 1;
      else {
        if (st.kind === "start" && !state.times[st.id]) state.times[st.id] = nowHM();
        state.i += 1; state.maxI = reached(); state.phase = "travel"; ui.confirmHelp = false;
      }
      save(); render(); top();
    } else if (act === "sheet-open") { openSheet("info");
    } else if (act === "wild-open") { openSheet("wild");
    } else if (act === "sheet-close") { $("#sheet").hidden = true; ui.confirmReset = false;
    } else if (act === "wild-toggle") {
      var id = el.getAttribute("data-id");
      if (state.wild[id]) delete state.wild[id]; else state.wild[id] = true;
      save(); render(); renderSheet();
      if (state.wild[id]) eggs().forEach(function (eg) { if (eg.trigger === "wild" && eg.wild === id && !state.eggs[eg.id]) findEgg(eg); });
    } else if (act === "reset-ask") { ui.confirmReset = true; renderSheet();
    } else if (act === "reset-no") { ui.confirmReset = false; renderSheet();
    } else if (act === "reset-yes") { state = fresh(); ui.confirmReset = false; save(); $("#sheet").hidden = true; render(); top(); }
  }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (b && !b.disabled) go(b.getAttribute("data-act"), b);
  });
  document.querySelector(".brand").addEventListener("click", function () {
    var e = eggs().filter(function (x) { return x.trigger === "taps"; })[0];
    if (!sess || !e) return;
    var need = e.taps || 5, win = e.window || 5000, n = countTap("logo", need, win);
    lean("logo", document.querySelector(".brand b"), n, need, win, function () { findEgg(e); });
  });
  /* Teamname-Auslöser: erst beim Verlassen des Feldes prüfen, nicht bei jedem Buchstaben */
  document.addEventListener("focusin", function (ev) {
    if (sess && ev.target && ev.target.id === "team") ui.nameBefore = state.team;
  });
  document.addEventListener("change", function (ev) {
    if (!sess || !ev.target || ev.target.id !== "team") return;
    if (nameAllowed(ev.target.value)) return;
    state.team = nameAllowed(ui.nameBefore) ? (ui.nameBefore || "") : "";
    save();
    ui.nameMsg = "That name belongs to the competition.";
    render();
    var eg = eggs().filter(function (x) { return x.trigger === "teamname"; })[0];
    if (eg && !state.eggs[eg.id]) findEgg(eg);
  });
  document.addEventListener("submit", function (e) {
    if (e.target && e.target.id === "gate") { e.preventDefault(); if (!ui.busy) unlock($("#pw").value); }
  });
  document.addEventListener("change", function (e) {
    if (sess && e.target && e.target.id === "photo") {
      state.photo[stations[state.i].id] = e.target.checked; save(); render();
    }
  });
  document.addEventListener("input", function (e) {
    if (sess && e.target && e.target.id === "team" && nameAllowed(e.target.value)) { state.team = e.target.value; ui.nameMsg = ""; save(); renderHeader(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("#sheet").hidden) go("sheet-close");
  });

  /* ---------- Start ---------- */
  function boot() {
    if (!(window.crypto && crypto.subtle && window.TextEncoder)) {
      renderHeader();
      $("#stage").innerHTML = "<p class=\"eyebrow\">Start</p><h1>Browser too old</h1><p class=\"lead\">This browser cannot unlock the rally. Please open the page in a current Safari or Chrome.</p>";
      return;
    }
    render();
    recall().then(function (r) {
      if (!r || !r.key) throw new Error("none");
      return openSession(r.key, false);
    }).catch(function () {
      forget(); sess = null; C = null; stations = []; state = fresh(); ui.booting = false; render();
    });
  }
  boot();
  /* Offline-Vorhaltung, damit ein Neuladen ohne Empfang die Seite nicht verliert */
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
  setInterval(function () { var c = $("#clock"); if (c) c.textContent = nowHM(); }, 15000);
})();
</script>
</body>
</html>
